[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyfid"
version = "0.1.0"
description = "Controlled molecular-to-polymer continued pretraining study"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3",
  "pyarrow>=16,<25",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "torch>=2.3,<3",
  "transformers>=4.44,<5",
  "rdkit>=2023.9",
  "typer>=0.12,<1",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "xgboost>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
baselines = [
  "chemprop==1.6.1",
  "PyTDC==1.1.15",
  "dgllife==0.2.9",
  "mordredcommunity==2.0.7",
  "torch-geometric==2.6.1",
  "mendeleev==0.20.1",
  "CombineMols==1.0.1.0",
]

[project.scripts]
polyfid = "polyfid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
